name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NfcTool.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NfcTool-apk
          path: NfcTool.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NFC Tool (τελευταία έκδοση)
          body: Κατέβασε το NfcTool.apk και άνοιξέ το στο κινητό για εγκατάσταση.
          files: NfcTool.apk
          make_latest: true
